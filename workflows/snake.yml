name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: mistery-alex06
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23E6D3A3&color_dots=%23111111,%233d3320,%23705a2e,%23a3823f,%23E6D3A3
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23F8F6F0&color_dots=%23111111,%233d3320,%23705a2e,%23a3823f,%23E6D3A3

      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
